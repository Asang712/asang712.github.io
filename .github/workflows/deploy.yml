name: Deploy to GitHub Pages

on:
  # 推送到 main 分支时自动部署
  push:
    branches: [main]
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

# GITHUB_TOKEN 所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一次部署，新的推送会排队等待
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies, build and upload artifact
        uses: withastro/action@v4
        with:
          node-version: 22
          package-manager: pnpm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
